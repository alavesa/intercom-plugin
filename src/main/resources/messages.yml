# Every player-facing string, in MiniMessage format (https://docs.advntr.dev/minimessage/format.html).
# Set a message to "" to not send it. <prefix> works everywhere.
# The announcement text and player names are always inserted as plain text: tags typed by a player do nothing.

prefix: "<gold>[Intercom]</gold> "

no-permission: "<prefix><red>You are not allowed to make announcements."
players-only: "<prefix><red>Only players can open the announcement dialog. Use <white>/announce test <text></white> from the console."
player-not-found: "<prefix><red>No player named <white><name></white> is online."

# An accepted announcement says nothing to its sender: the banner and the chime are the confirmation.
blank: "<prefix><red>Type a message first."
too-long: "<prefix><red>That is <length> characters; the limit is <max>."
does-not-fit: "<prefix><red>That message needs <lines> lines; the banner has room for <max>. Shorten it."
# <time> = minutes:seconds, <seconds> = the same in seconds
cooldown: "<prefix><red>You can make another announcement in <time>."
queue-full: "<prefix><red>Too many announcements are waiting. Try again in a moment."

reloaded: "<prefix><green>Reloaded. <gray>Pack <sha1>, text shader: <shader>."
cleared: "<prefix><green>Stopped the current announcement and removed <count> queued."

microphone:
  item-name: "<gold>Intercom Microphone"
  no-build: "<prefix><red>Only server operators can place or remove microphones."
  given: "<prefix><gray>Right-click a block to place the microphone. Sneak + right-click a microphone to take it away."
  placed: ""
  removed: ""

# What players WITHOUT the resource pack see (fallback.mode) and the chat copy (announcement.chat-copy).
# <message> and <sender> come with the colours and styles of the announcement.
chat-format: "<gold>[Intercom]</gold> <message> <sender>"
actionbar-format: "<message> <sender>"

dialog:
  title: "Intercom"
  # <max> = announcement.max-characters
  # Keep it short: in the textured dialog it must fit one line of the panel (about 38 characters).
  hint: "<gray>To everyone online - max <max> characters"
  input-label: "Message"
  send: "Send"
  send-tooltip: "Broadcast this to every player"
  cancel: "Cancel"
